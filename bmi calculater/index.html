<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calculator">
    <h1>BMI CALCULATOR</h1>
    <div class="input-section">
        <label for="weight">Weight (kg)</label>
        <input type="range" id="weight"
        min="20" max="150" step="1" value="60">
        <span id="weight-value">60 kg</span>
    </div>
    <div class="input-section">
        <label for="height">Height (cm)</label>
        <input type="range" id="height"
        min="100" max="220" step="1" value="170">
        <span id="height-value">170 cm</span>
    </div>
    <button onclick="calculator()">Calculate BMI</button>
    <div class="output-section">
        <p>Weight : <span id="display-weight">----</span></p>
        <p>Height : <span id="display-height">----</span></p>
        <p>BMI : <span id="bmi-result">----</span></p>
        <p>Category : <span id="bmi-category">----</span></p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
